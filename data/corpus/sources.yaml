# Inventaire du corpus réglementaire de ComplianceCopilot (module 1, V1).
# Les fichiers PDF ne sont pas versionnés dans Git (droits d'auteur de certains documents) :
# cet inventaire permet de retrouver chaque texte à sa source officielle.
#
# Champs :
#   id                 identifiant court utilisé dans l'application et dans les citations
#   titre              titre officiel
#   type               loi | ordonnance | accord_international | autoregulation | standard_international
#   juridiction        CH | CH-US | international
#   rs                 numéro du Recueil systématique du droit fédéral (si applicable)
#   etat               date « État le » ou de mise à jour du document téléchargé
#   valide_depuis      date à partir de laquelle cette version s'applique (si connue)
#   valide_jusqu_au    date de fin d'application connue (null = pas de fin connue)
#   fichier            nom du fichier dans data/corpus/
#   source             éditeur officiel
#   url                page officielle (à compléter quand indiqué)
#   droits             libre (texte officiel non protégé) | reserves (diffusion soumise à autorisation)
#   telecharge_le      date du téléchargement
#   remarques          points d'attention pour la mise à jour du corpus

